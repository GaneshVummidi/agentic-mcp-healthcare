<svg width="640" height="420" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF6F2"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF3F2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F6E5B"/>
      <stop offset="100%" stop-color="#1AA88A"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#sky)" rx="18"/>

  <!-- ground -->
  <rect x="0" y="360" width="640" height="60" fill="#DCEFE9"/>

  <!-- main hospital building -->
  <rect x="150" y="140" width="340" height="220" fill="url(#bldg)" stroke="#CFE4DE" stroke-width="2" rx="6"/>
  <!-- side wings -->
  <rect x="80" y="210" width="80" height="150" fill="#F3F8F6" stroke="#CFE4DE" stroke-width="2" rx="4"/>
  <rect x="480" y="190" width="90" height="170" fill="#F3F8F6" stroke="#CFE4DE" stroke-width="2" rx="4"/>

  <!-- top accent bar -->
  <rect x="150" y="140" width="340" height="14" fill="url(#accent)"/>

  <!-- windows grid main -->
  <g fill="#BFE3D9">
    <rect x="175" y="175" width="26" height="26" rx="3"/>
    <rect x="215" y="175" width="26" height="26" rx="3"/>
    <rect x="255" y="175" width="26" height="26" rx="3"/>
    <rect x="360" y="175" width="26" height="26" rx="3"/>
    <rect x="400" y="175" width="26" height="26" rx="3"/>
    <rect x="440" y="175" width="26" height="26" rx="3"/>

    <rect x="175" y="220" width="26" height="26" rx="3"/>
    <rect x="215" y="220" width="26" height="26" rx="3"/>
    <rect x="255" y="220" width="26" height="26" rx="3"/>
    <rect x="360" y="220" width="26" height="26" rx="3"/>
    <rect x="400" y="220" width="26" height="26" rx="3"/>
    <rect x="440" y="220" width="26" height="26" rx="3"/>

    <rect x="175" y="265" width="26" height="26" rx="3"/>
    <rect x="215" y="265" width="26" height="26" rx="3"/>
    <rect x="255" y="265" width="26" height="26" rx="3"/>
    <rect x="360" y="265" width="26" height="26" rx="3"/>
    <rect x="400" y="265" width="26" height="26" rx="3"/>
    <rect x="440" y="265" width="26" height="26" rx="3"/>
  </g>

  <!-- entrance -->
  <rect x="298" y="290" width="44" height="70" fill="#0F6E5B" rx="3"/>
  <rect x="308" y="300" width="10" height="60" fill="#1AA88A"/>
  <rect x="322" y="300" width="10" height="60" fill="#1AA88A"/>

  <!-- cross emblem on building -->
  <g transform="translate(300 90)">
    <circle cx="20" cy="20" r="26" fill="#FFFFFF" stroke="#1AA88A" stroke-width="3"/>
    <path d="M20 8v24M8 20h24" stroke="#0F6E5B" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- side wing windows -->
  <g fill="#D7EEE7">
    <rect x="95" y="235" width="20" height="20" rx="2"/>
    <rect x="130" y="235" width="20" height="20" rx="2"/>
    <rect x="95" y="270" width="20" height="20" rx="2"/>
    <rect x="130" y="270" width="20" height="20" rx="2"/>
    <rect x="500" y="215" width="20" height="20" rx="2"/>
    <rect x="535" y="215" width="20" height="20" rx="2"/>
    <rect x="500" y="250" width="20" height="20" rx="2"/>
    <rect x="535" y="250" width="20" height="20" rx="2"/>
  </g>

  <!-- ambulance -->
  <g transform="translate(30 330)">
    <rect x="0" y="10" width="70" height="30" rx="4" fill="#FFFFFF" stroke="#1AA88A" stroke-width="2"/>
    <rect x="55" y="16" width="20" height="24" rx="3" fill="#FFFFFF" stroke="#1AA88A" stroke-width="2"/>
    <circle cx="18" cy="42" r="7" fill="#0F6E5B"/>
    <circle cx="60" cy="42" r="7" fill="#0F6E5B"/>
    <path d="M25 20h10M30 15v10" stroke="#E4572E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- trees -->
  <g fill="#1AA88A" opacity="0.55">
    <circle cx="555" cy="355" r="16"/>
    <circle cx="575" cy="360" r="12"/>
    <circle cx="60" cy="358" r="14"/>
  </g>
</svg>
